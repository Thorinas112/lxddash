name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Run Go vet
        run: go vet ./...

      - name: Run Go tests
        run: go test -v -race -count=1 ./...

      - name: Build backend (Linux amd64)
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: go build -o bin/lxddash-linux-amd64 ./cmd/server

      - name: Build backend (Linux arm64)
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: arm64
        run: go build -o bin/lxddash-linux-arm64 ./cmd/server

      - name: Build frontend
        run: cd web && npm install && npm run build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lxddash
          path: |
            bin/lxddash-linux-amd64
            bin/lxddash-linux-arm64
            web/dist/

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: lxddash
          path: dist/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/bin/lxddash-linux-amd64
            dist/bin/lxddash-linux-arm64
          generate_release_notes: true
          draft: false
          prerelease: false
